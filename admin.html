<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — pargchvsky</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#333;--text:#f3f0e8;--muted:#aaa;--accent:#d5ff45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin:32px 0}.login{max-width:440px;margin:10vh auto}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#101010;color:var(--text);border:1px solid #444;border-radius:9px;padding:12px}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:999px;background:var(--accent);color:#111;font-weight:750;padding:12px 18px}.btn.secondary{background:transparent;color:var(--text);border:1px solid #555}.btn.danger{background:#542b2b;color:#fff}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none!important}.project-groups{display:grid;gap:28px}.project-group h3{margin:0 0 12px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.1em}.admin-project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-project-card{border:1px solid var(--line);background:#191919;overflow:hidden;cursor:grab;transition:border-color .2s,transform .2s}.admin-project-card.dragging{opacity:.45;border-color:var(--accent)}.admin-project-card.drag-over{outline:2px solid var(--accent)}.admin-project-image{height:150px;background:#242424;position:relative;overflow:hidden}.admin-project-image img{width:100%;height:100%;object-fit:cover;display:block}.admin-project-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:26px;font-weight:800;letter-spacing:-.06em}.admin-project-body{padding:14px}.admin-project-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.admin-project-body h4{font-size:19px;margin:10px 0}.admin-project-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.admin-project-tag{border:1px solid #414141;border-radius:99px;padding:4px 8px;font-size:10px;color:#ddd}.admin-project-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.admin-project-actions .btn{padding:8px 12px;font-size:12px}.drag-hint{font-size:11px;color:var(--muted);margin:0 0 14px}.status{font-size:12px;color:var(--muted)}@media(max-width:700px){.admin-project-grid{grid-template-columns:1fr}}.role-tags{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1px solid #444;border-radius:9px;min-height:48px;background:#101010}.role-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #555;border-radius:999px;color:var(--text);font-size:13px}.role-chip button{border:0;background:transparent;color:#aaa;padding:0;line-height:1;font-size:16px}.role-entry{border:0!important;outline:0!important;background:transparent!important;padding:4px!important;min-width:160px;flex:1}.crop-editor{margin-top:14px;max-width:680px}.crop-stage{position:relative;width:100%;aspect-ratio:16/9;background:#080808;border:1px solid #555;border-radius:10px;overflow:hidden;cursor:grab;touch-action:none}.crop-stage:active{cursor:grabbing}.crop-stage img{position:absolute;max-width:none;user-select:none;pointer-events:none}.crop-controls{display:flex;align-items:center;gap:14px;margin-top:10px}.crop-controls input{flex:1}.notice{padding:12px;border:1px solid #555;border-radius:10px;margin:12px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}.project{align-items:flex-start}}
</style>
</head>
<body>
<header class="wrap top"><div class="brand">pargchvsky <span class="muted">/ admin</span></div><a class="muted" href="./">← На сайт</a></header>
<main class="wrap">
<section id="login" class="panel login">
<h1>Вход в админку</h1><p class="muted">Авторизуйся своим аккаунтом администратора.</p>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Войти</button>
</form><div id="loginMsg" class="notice hidden"></div>
</section>
<section id="app" class="hidden">
<div class="row" style="justify-content:space-between;margin:32px 0 18px"><div><h1 style="margin:0">Проекты</h1><div class="muted" id="userLabel"></div></div><button id="logout" class="btn secondary">Выйти</button></div>
<div class="panel">
<div class="row" style="justify-content:space-between"><h2 id="formTitle" style="margin:0">Новый проект</h2><button id="newProject" class="btn secondary">+ Новый проект</button></div>
<form id="projectForm">
<input id="projectId" type="hidden">
<div class="grid">
<div class="field"><label for="category">Направление</label><select id="category" required><option value="events">Мероприятия</option><option value="producing">Продюсирование</option><option value="directing">Аудиовизуальные проекты</option></select></div>
<div class="field"><label for="title">Название проекта</label><input id="title" required placeholder="Например, HSE Unity"></div>
</div>
<div class="field"><label for="description">Описание проекта и мой вклад</label><textarea id="description" placeholder="Что это за проект, какие задачи ты решал и что именно делал"></textarea></div>
<div class="grid">
<div class="field"><label>Моя роль — ярлыки</label><div id="roleTags" class="role-tags"><input id="roleEntry" class="role-entry" placeholder="Введи роль и нажми Enter"></div><div class="status">Каждую роль добавляй отдельно клавишей Enter.</div></div>
<div class="field"><label for="result">Результат</label><input id="result" placeholder="Например, 700 участников"></div>
</div>
<div class="grid">
<div class="field"><label for="cover">Обложка проекта</label><input id="cover" type="file" accept="image/*"></div>
<div class="field"><label for="video">Ссылка на видео (необязательно)</label><input id="video" type="url" placeholder="https://..."></div>
</div>
<div id="coverPreview" class="muted"></div><div id="cropEditor" class="crop-editor hidden"><div class="status" style="margin-bottom:8px">Перетащи фото, чтобы выбрать кадр. Используй ползунок для масштабирования.</div><div id="cropStage" class="crop-stage"><img id="cropImage" alt="Предпросмотр обложки"></div><div class="crop-controls"><label for="cropZoom" class="status">Масштаб</label><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></div></div>
<div class="field"><label><input id="published" type="checkbox" style="width:auto;margin-right:8px">Опубликовать на сайте</label></div>
<div class="row"><button class="btn" type="submit">Сохранить проект</button><button class="btn secondary" type="button" id="cancelEdit">Очистить</button></div>
</form><div id="formMsg" class="notice hidden"></div>
</div>
<div class="panel"><h2>Все проекты</h2><div id="projectsList" class="muted">Загрузка…</div></div>
</section>
</main>
<script>
const SUPABASE_URL='https://gccrdvexzfihtzozxqfk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_XUdqO9b1FraH5PHWpuRj6g_omlMN7Z5';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
function message(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
let roleTags=[];let cropImageLoaded=false,cropScale=1,cropBase=1,cropX=0,cropY=0,cropW=0,cropH=0,cropNaturalW=0,cropNaturalH=0,cropPointer=null;
function renderRoleTags(){const box=$('roleTags');box.querySelectorAll('.role-chip').forEach(el=>el.remove());const input=$('roleEntry');roleTags.forEach((tag,index)=>{const chip=document.createElement('span');chip.className='role-chip';const label=document.createElement('span');label.textContent=tag;const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Удалить '+tag);remove.onclick=()=>{roleTags.splice(index,1);renderRoleTags();};chip.append(label,remove);box.insertBefore(chip,input);});}
function addRoleTag(value){const tag=value.trim();if(tag&&!roleTags.some(x=>x.toLowerCase()===tag.toLowerCase()))roleTags.push(tag);$('roleEntry').value='';renderRoleTags();}
$('roleEntry').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addRoleTag($('roleEntry').value);}else if(e.key==='Backspace'&&!$('roleEntry').value&&roleTags.length){roleTags.pop();renderRoleTags();}});
$('roleEntry').addEventListener('blur',()=>{if($('roleEntry').value.trim())addRoleTag($('roleEntry').value);});
function clearForm(){ $('projectForm').reset();roleTags=[];renderRoleTags();$('projectId').value='';$('formTitle').textContent='Новый проект';$('coverPreview').textContent='';$('cropEditor').classList.add('hidden');cropImageLoaded=false;$('formMsg').classList.add('hidden');}

function layoutCrop(){
 if(!cropImageLoaded)return;
 const stage=$('cropStage'),img=$('cropImage');const r=stage.getBoundingClientRect();cropW=r.width;cropH=r.height;
 cropBase=Math.max(cropW/cropNaturalW,cropH/cropNaturalH);
 const w=cropNaturalW*cropBase*cropScale,h=cropNaturalH*cropBase*cropScale;
 cropX=Math.min(0,Math.max(cropW-w,cropX));cropY=Math.min(0,Math.max(cropH-h,cropY));
 img.style.width=w+'px';img.style.height=h+'px';img.style.left=cropX+'px';img.style.top=cropY+'px';
}
function loadCropFile(file){
 if(!file)return;
 const url=URL.createObjectURL(file);const img=$('cropImage');
 img.onload=()=>{cropNaturalW=img.naturalWidth;cropNaturalH=img.naturalHeight;cropScale=1;cropX=0;cropY=0;cropImageLoaded=true;$('cropZoom').value='1';$('cropEditor').classList.remove('hidden');layoutCrop();};
 img.src=url;
}
$('cover').addEventListener('change',()=>loadCropFile($('cover').files[0]));
$('cropZoom').addEventListener('input',e=>{const old=cropScale;const next=Number(e.target.value);const cx=cropW/2,cy=cropH/2;cropX=cx-(cx-cropX)*(next/old);cropY=cy-(cy-cropY)*(next/old);cropScale=next;layoutCrop();});
$('cropStage').addEventListener('pointerdown',e=>{cropPointer={x:e.clientX,y:e.clientY};$('cropStage').setPointerCapture(e.pointerId);});
$('cropStage').addEventListener('pointermove',e=>{if(!cropPointer)return;cropX+=e.clientX-cropPointer.x;cropY+=e.clientY-cropPointer.y;cropPointer={x:e.clientX,y:e.clientY};layoutCrop();});
$('cropStage').addEventListener('pointerup',()=>cropPointer=null);
$('cropStage').addEventListener('pointercancel',()=>cropPointer=null);
async function makeCroppedCover(file){
 if(!cropImageLoaded)return file;
 const scale=cropBase*cropScale;
 const sx=Math.max(0,Math.min(cropNaturalW-cropW/scale,-cropX/scale));
 const sy=Math.max(0,Math.min(cropNaturalH-cropH/scale,-cropY/scale));
 const sw=Math.min(cropNaturalW-sx,cropW/scale),sh=Math.min(cropNaturalH-sy,cropH/scale);
 const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=900;
 const ctx=canvas.getContext('2d');ctx.drawImage($('cropImage'),sx,sy,sw,sh,0,0,1600,900);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));
 return new File([blob],(file.name.replace(/\\.[^.]+$/,'')||'cover')+'-cover.jpg',{type:'image/jpeg'});
}

async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}
 const {data:admin,error}=await db.from('portfolio_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
 if(error||!admin){await db.auth.signOut();$('login').classList.remove('hidden');$('app').classList.add('hidden');message('loginMsg','У этого аккаунта нет прав администратора.');return;}
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=session.user.email;await loadProjects();
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').classList.add('hidden');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){message('loginMsg',error.message);return;}await checkSession();});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});
$('newProject').addEventListener('click',clearForm);$('cancelEdit').addEventListener('click',clearForm);
async function loadProjects(){
 const {data,error}=await db.from('portfolio_projects').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});
 if(error){$('projectsList').textContent='Ошибка загрузки: '+error.message;return;}
 if(!data.length){$('projectsList').textContent='Пока проектов нет. Создай первый выше.';return;}
 const categories=[['events','Мероприятия'],['producing','Продюсирование'],['directing','Аудиовизуальные проекты']];
 $('projectsList').innerHTML='<p class="drag-hint">Перетаскивай карточки внутри раздела, чтобы менять порядок проектов на сайте. Изменения сохраняются автоматически.</p>';
 const groups=document.createElement('div');groups.className='project-groups';
 for(const [key,label] of categories){
  const items=data.filter(p=>p.category===key);
  if(!items.length)continue;
  const group=document.createElement('section');group.className='project-group';group.dataset.category=key;
  const heading=document.createElement('h3');heading.textContent=label;group.appendChild(heading);
  const grid=document.createElement('div');grid.className='admin-project-grid';grid.dataset.category=key;
  items.forEach(p=>{
   const card=document.createElement('article');card.className='admin-project-card';card.draggable=true;card.dataset.id=p.id;
   const visual=document.createElement('div');visual.className='admin-project-image';
   if(p.cover_path){const img=document.createElement('img');img.src=db.storage.from('portfolio-media').getPublicUrl(p.cover_path).data.publicUrl;img.alt=p.title;visual.appendChild(img);}
   else{const ph=document.createElement('div');ph.className='admin-project-placeholder';ph.textContent=p.title;visual.appendChild(ph);}
   const body=document.createElement('div');body.className='admin-project-body';
   const meta=document.createElement('div');meta.className='admin-project-meta';const cat=document.createElement('span');cat.textContent=label;const state=document.createElement('span');state.textContent=p.published?'Опубликован':'Черновик';meta.append(cat,state);
   const title=document.createElement('h4');title.textContent=p.title;
   const tags=document.createElement('div');tags.className='admin-project-tags';
   [...(p.role||'').split(',').map(x=>x.trim()).filter(Boolean),...(p.result?[p.result]:[])].forEach(t=>{const chip=document.createElement('span');chip.className='admin-project-tag';chip.textContent=t;tags.appendChild(chip);});
   const actions=document.createElement('div');actions.className='admin-project-actions';
   const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Изменить';edit.type='button';edit.onclick=()=>editProject(p);
   const del=document.createElement('button');del.className='btn danger';del.textContent='Удалить';del.type='button';del.onclick=()=>deleteProject(p);
   actions.append(edit,del);body.append(meta,title);if(tags.childElementCount)body.appendChild(tags);body.appendChild(actions);card.append(visual,body);grid.appendChild(card);
   card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');});
   card.addEventListener('dragend',()=>{card.classList.remove('dragging');grid.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));});
   card.addEventListener('dragover',e=>{e.preventDefault();if(!card.classList.contains('dragging'))card.classList.add('drag-over');});
   card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
   card.addEventListener('drop',async e=>{e.preventDefault();card.classList.remove('drag-over');const draggedId=e.dataTransfer.getData('text/plain');const dragged=grid.querySelector('[data-id="'+draggedId+'"]');if(!dragged||dragged===card)return;const rect=card.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;grid.insertBefore(dragged,after?card.nextSibling:card);await persistProjectOrder(grid);});
  });
  group.appendChild(grid);groups.appendChild(group);
 }
 $('projectsList').appendChild(groups);
}
async function persistProjectOrder(grid){
 const cards=[...grid.querySelectorAll('.admin-project-card')];
 for(let index=0;index<cards.length;index++){
  const {error}=await db.from('portfolio_projects').update({sort_order:index+1,updated_at:new Date().toISOString()}).eq('id',cards[index].dataset.id);
  if(error){message('formMsg','Не удалось сохранить порядок: '+error.message);await loadProjects();return;}
 }
 message('formMsg','Порядок проектов сохранён.'); 
}
function editProject(p){$('projectId').value=p.id;$('category').value=p.category;$('title').value=p.title;$('description').value=[p.description,p.tasks].filter(Boolean).join('\\n\\n');roleTags=(p.role||'').split(',').map(x=>x.trim()).filter(Boolean);renderRoleTags();$('result').value=p.result||'';$('video').value=p.video_url||'';$('published').checked=p.published;$('formTitle').textContent='Редактировать проект';$('coverPreview').textContent=p.cover_path?'Текущая обложка: '+p.cover_path:'';window.scrollTo({top:0,behavior:'smooth'});}
$('projectForm').addEventListener('submit',async e=>{
 e.preventDefault();$('formMsg').classList.add('hidden');
 const id=$('projectId').value;let coverPath=null;
 let file=$('cover').files[0];
 if(file){file=await makeCroppedCover(file);coverPath=(crypto.randomUUID()+'.jpg');const {error}=await db.storage.from('portfolio-media').upload(coverPath,file,{upsert:false,contentType:'image/jpeg'});if(error){message('formMsg','Ошибка загрузки файла: '+error.message);return;}}
 const payload={category:$('category').value,title:$('title').value.trim(),slug:$('title').value.trim().toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-|-$/g,''),description:$('description').value,role:roleTags.join(', '),tasks:'',result:$('result').value,video_url:$('video').value, published:$('published').checked,updated_at:new Date().toISOString()};
 if(coverPath)payload.cover_path=coverPath;
 let result;
 if(id)result=await db.from('portfolio_projects').update(payload).eq('id',id);else result=await db.from('portfolio_projects').insert(payload);
 if(result.error){message('formMsg','Ошибка сохранения: '+result.error.message);return;}
 message('formMsg','Проект сохранён.');clearForm();await loadProjects();
});
async function deleteProject(p){if(!confirm('Удалить проект «'+p.title+'»?'))return;const {error}=await db.from('portfolio_projects').delete().eq('id',p.id);if(error){alert(error.message);return;}if(p.cover_path)await db.storage.from('portfolio-media').remove([p.cover_path]);await loadProjects();}
db.auth.onAuthStateChange(()=>{setTimeout(checkSession,0);});
checkSession();
</script>
</body></html>
